name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'mail_tool.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mail_tool.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
      - 'BUILD_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name mail_tool_windows --collect-all pandas --hidden-import win32timezone mail_tool.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail-tool-windows
          path: dist/mail_tool_windows.exe
          if-no-files-found: error
      - name: Publish latest build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: latest-build
          prerelease: true
          files: dist/mail_tool_windows.exe
