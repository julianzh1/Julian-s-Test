name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'mail_tool.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "对账及询证函邮件发送工具" --collect-all pandas --hidden-import win32timezone mail_tool.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 对账及询证函邮件发送工具
          path: dist/对账及询证函邮件发送工具.exe
          if-no-files-found: error
