name: Build CSharp Portable EXE

on:
  pull_request:
    branches: [main]
    paths:
      - 'csharp-portable/**'
      - '.github/workflows/build-csharp-portable.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: msbuild csharp-portable/MailTool.csproj /t:Restore
      - name: Build
        run: msbuild csharp-portable/MailTool.csproj /p:Configuration=Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail-tool-csharp-portable
          path: csharp-portable/bin/Release/net48/对账及询证函邮件工具_便携版.exe
          if-no-files-found: error
